# Path item de GET /{entity}/{id}/_files/{field}, referenciado por openapi.yaml (que já passou do limite de tamanho).
parameters:
  - $ref: 'openapi.yaml#/components/parameters/entity'
  - name: id
    in: path
    required: true
    schema: { type: string }
  - name: field
    in: path
    required: true
    description: Nome de um campo type file da entidade.
    schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
get:
  summary: Baixar o arquivo gravado num campo file
  description: >-
    Mesmas conferências da leitura do registro (read na entidade, escopo, campo visível ao usuário). Campo que não
    é file ou registro sem arquivo → 404. Os bytes vêm do sistema, que guarda o arquivo (escrita delegada).
  operationId: downloadFile
  responses:
    '200':
      description: O arquivo, com o nome original em Content-Disposition (filename* em UTF-8).
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    '401': { $ref: 'openapi.yaml#/components/responses/Error' }
    '403': { $ref: 'openapi.yaml#/components/responses/Error' }
    '404': { $ref: 'openapi.yaml#/components/responses/Error' }
