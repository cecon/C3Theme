name: engine

on:
  pull_request:
  push:
    branches: [main]
  # permite rodar à mão pela aba Actions
  workflow_dispatch:

# um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-and-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a cobertura do diff compara com a base do PR
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/c3-engine-rusqlite
      - run: pnpm install --frozen-lockfile
        # o exemplo Electron só é compilado aqui, nunca aberto: sem os ~120 MB do binário
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm lines:check
      - run: pnpm spec:check
      - run: pnpm skills:check
      - run: pnpm typecheck
      - run: pnpm lint
      # Imports caros ficam fora da entrada; o catálogo inteiro exige opt-in explícito (#121).
      - run: node scripts/check-entry-bundle.mjs && node scripts/check-entry-bundle.mjs --full-icons
      # testes + cobertura mínima por pacote (scripts/coverage-floors.ts; meta 80% de linhas e branches)
      - run: pnpm test:coverage
      # o que vai para o npm (ui, chat, engine): só dist + LICENSE + README, sem teste, sem workspace:
      - run: pnpm pack:check
      # catálogo de componentes: história quebrada (import, tipo, build) reprova aqui
      - run: pnpm build:storybook
      # acessibilidade: axe em todas as histórias, claro e escuro; achado novo reprova
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm a11y:storybook
      # e2e: fluxos de usuário no navegador contra o build de produção da vitrine (motor) e do Storybook
      - run: pnpm --filter @c3theme/showcase build
      - run: pnpm e2e
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # adaptador rusqlite: workspace próprio (outro libsqlite3-sys)
      - run: cargo fmt --check --manifest-path crates/c3-engine-rusqlite/Cargo.toml
      - run: cargo clippy --manifest-path crates/c3-engine-rusqlite/Cargo.toml --all-targets -- -D warnings
      # testes Rust dos dois workspaces + conformidade contra o c3-example, com cobertura mínima (scripts/coverage-rust.mjs)
      - run: pnpm coverage:rust
      # conformidade do backend Node (a do Rust já rodou acima, medida)
      - run: pnpm conformance node
      # linhas que o PR escreveu: mínimo de 80% cobertas (lê os lcov dos dois passos de cobertura)
      - run: pnpm coverage:diff
        if: github.event_name == 'pull_request'
        env:
          C3_BASE: origin/${{ github.base_ref }}
      # o app que o pnpm create-app gera (Rust e Node) compila, sobe e grava pela API
      - run: node scripts/create-app-smoke.mjs

  # testes de mutação só nas linhas que o PR escreveu, meta de 90% (scripts/mutation-*.mjs). Por enquanto mede e mostra
  # sem reprovar (continue-on-error): os pacotes estão entre 24% e 74% (ADR 0002). Corre em paralelo ao job principal;
  # a rodada do repositório inteiro, essa sim com piso que reprova, é semanal (mutation.yml).
  mutation-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/c3-engine-rusqlite
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm mutation:ts --diff
        continue-on-error: true
        env:
          C3_BASE: origin/${{ github.base_ref }}
      - run: pnpm mutation:rust --diff
        continue-on-error: true
        env:
          C3_BASE: origin/${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-pr
          path: reports/mutation/
