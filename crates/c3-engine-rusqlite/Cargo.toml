[package]
name = "c3-engine-rusqlite"
description = "Adaptador rusqlite do c3-engine: o motor usa a mesma biblioteca SQLite (e as conexões) do sistema."
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

# Workspace próprio: o workspace da raiz usa sqlx, que linka outra versão do libsqlite3-sys.
[workspace]

[dependencies]
async-trait = "0.1"
c3-engine = { path = "../c3-engine" }
regex = "1"
# 0.40 = libsqlite3-sys 0.38, a versão do Nati. Mudar junto com o sistema que usa o adaptador.
rusqlite = { version = "0.40", features = ["functions"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
rusqlite = { version = "0.40", features = ["functions", "bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
